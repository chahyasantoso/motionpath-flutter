name: motionpath_flutter
description: Flutter adapters and renderers for the MotionPath v4 engine.
version: 0.1.0
repository: https://github.com/chahyasantoso/motionpath-flutter
issue_tracker: https://github.com/chahyasantoso/motionpath-flutter/issues
documentation: https://github.com/chahyasantoso/motionpath-flutter/tree/main/docs
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  motionpath_core:
    path: ../motionpath_core
  vector_math: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
