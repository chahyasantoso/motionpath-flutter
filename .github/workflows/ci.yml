name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/motionpath_core
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Pub get
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test

  flutter-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/motionpath_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  flutter-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: |
          status=0
          flutter analyze --format=machine > analyze.log 2>&1 || status=$?
          cat analyze.log
          while IFS='|' read -r level file line column code message; do
            if [ -n "$message" ]; then
              echo "::error file=$file,line=$line,col=$column,title=$code::$message"
            fi
          done < analyze.log
          exit "$status"
      - name: Test
        run: flutter test
