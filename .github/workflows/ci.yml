name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/motionpath_core
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Pub get
        run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test --reporter expanded

  flutter-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/motionpath_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  flutter-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
