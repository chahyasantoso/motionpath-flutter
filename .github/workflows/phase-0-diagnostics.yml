name: Phase 0 diagnostics

on:
  push:
    branches: [phase-0-ci-verification]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-ci-verification
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Capture core tests
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          set +e
          (cd packages/motionpath_core && dart pub get && dart test --reporter expanded) > ci-diagnostics/core-test.log 2>&1
          echo $? > ci-diagnostics/core-test.exit
      - name: Capture adapter tests
        shell: bash
        run: |
          set +e
          (cd packages/motionpath_flutter && flutter pub get && flutter test --reporter expanded) > ci-diagnostics/flutter-test.log 2>&1
          echo $? > ci-diagnostics/flutter-test.exit
      - name: Capture example tests
        shell: bash
        run: |
          set +e
          (cd example && flutter pub get && flutter test --reporter expanded) > ci-diagnostics/example-test.log 2>&1
          echo $? > ci-diagnostics/example-test.exit
      - name: Commit diagnostics and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics
          git rm .github/workflows/phase-0-diagnostics.yml
          git commit -m "test: record Phase 0 CI diagnostics"
          git push origin HEAD:phase-0-ci-verification
